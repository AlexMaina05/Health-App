<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>RosettaHealth - Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0b0b0f;
      --text: #cbd5e1;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg); color: var(--text); font-family: var(--font);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; position: relative; text-align: center;
    }
    .glass { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .text-gradient {
      background: -webkit-linear-gradient(45deg, #a855f7, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .mesh-bg {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(circle at 10% 50%, rgba(139, 92, 246, 0.15), transparent 40%),
                  radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.15), transparent 40%);
    }
    .container {
      position: relative; z-index: 10; max-width: 900px; padding: 0 24px;
    }
    h1 {
      font-size: 4.5rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 24px;
    }
    p {
      font-size: 1.5rem; font-weight: 300; color: #94a3b8; margin-bottom: 48px;
      line-height: 1.6; max-width: 700px; margin-left: auto; margin-right: auto;
    }
    .buttons {
      display: flex; gap: 24px; justify-content: center; align-items: center;
    }
    .btn {
      text-decoration: none; padding: 16px 32px; border-radius: 9999px;
      font-size: 1.125rem; font-weight: 600; transition: all 0.3s ease;
      display: inline-block;
    }
    .btn-primary {
      background: linear-gradient(90deg, #a855f7, #0ea5e9); color: white;
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3); border: none;
    }
    .btn-primary:hover {
      transform: translateY(-4px); box-shadow: 0 12px 40px rgba(139, 92, 246, 0.5);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1); transform: translateY(-4px);
    }
    

    .waitlist-form {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .flex-form {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      justify-content: center;
    }
    .email-input {
      flex: 1;
      padding: 16px 24px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .email-input::placeholder {
      color: #64748b;
    }
    .email-input:focus {
      border-color: #a855f7;
      background: rgba(255,255,255,0.1);
    }
    .submit-btn {
      cursor: pointer;
    }
    .waitlist-subtext {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0;
      max-width: 100%;
    }
    
    @media (max-width: 768px) {
      .flex-form { flex-direction: column; }
      h1 { font-size: 3rem; }
      p { font-size: 1.25rem; }
      .buttons { flex-direction: column; width: 100%; gap: 16px; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="mesh-bg"></div>
  <div class="container">
    <h1 class="text-gradient drop-shadow-lg">⚕️ RosettaHealth</h1>
    <p>Il ponte Zero-Cloud tra il tuo Fascicolo Sanitario e Apple Salute. Inietta i referti PDF nell'ecosistema Apple in totale sicurezza.</p>
    
    <div class="waitlist-form">
      <a href="mailto:maina@alexmaina.dev?subject=Richiesta%20Accesso%20Beta%20TestFlight%20RosettaHealth&body=Ciao%20Alex,%0A%0AVorrei%20partecipare%20alla%20Beta%20privata%20su%20TestFlight%20per%20iOS.%0A%0AGrazie!" class="btn btn-primary">
        &#128640; Partecipa alla Beta (TestFlight)
      </a>
      <p class="waitlist-subtext" style="margin-top: 12px;">Richiedi l'invito ufficiale tramite email per l'app iOS.</p>
    </div>
    
    <div class="buttons" style="margin-top: 32px;">
      <a href="tesi/" class="btn btn-secondary glass" style="font-size: 0.9rem; padding: 10px 24px;">Leggi la Documentazione (Tesi)</a>
    </div>
  </div>
</body>
</html>
