<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <title>RosettaHealth - Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { bg: '#0b0b0f' } } }
    }
  </script>
  <style>
    body { background-color: #0b0b0f; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .glass { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .text-gradient { background: -webkit-linear-gradient(45deg, #a855f7, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .mesh-bg {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(circle at 10% 50%, rgba(139, 92, 246, 0.15), transparent 40%),
                  radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.15), transparent 40%);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center relative bg-bg text-slate-300 antialiased overflow-hidden selection:bg-purple-500/30">

  <div class="mesh-bg"></div>
  
  <div class="relative z-10 max-w-4xl px-6 text-center">
    <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-gradient drop-shadow-lg">⚕️ RosettaHealth</h1>
    
    <p class="text-lg md:text-2xl font-light text-slate-400 mb-12 max-w-2xl mx-auto leading-relaxed">
      Il ponte Zero-Cloud tra il tuo Fascicolo Sanitario e Apple Salute. Inietta i referti PDF nell'ecosistema Apple in totale sicurezza.
    </p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
      <a href="README.html" class="w-full sm:w-auto px-8 py-4 rounded-full bg-gradient-to-r from-purple-500 to-sky-500 text-white font-semibold text-lg shadow-[0_8px_30px_rgba(139,92,246,0.3)] hover:shadow-[0_12px_40px_rgba(139,92,246,0.5)] hover:-translate-y-1 transition-all duration-300">
        Inizia a Leggere
      </a>
      
      <a href="https://github.com/AlexMaina05/Health-App" class="w-full sm:w-auto px-8 py-4 rounded-full bg-white/5 border border-white/10 text-white font-semibold text-lg glass hover:bg-white/10 hover:-translate-y-1 transition-all duration-300 shadow-lg">
        Guarda su GitHub
      </a>
    </div>
  </div>

</body>
</html>
