name: iOS Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14 # Uses latest macOS (M1/M2 silicon runners on GH)
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Install Dependencies
      run: |
        brew install xcodegen
        # sudo gem install xcpretty # optional for formatting

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Run RosettaHealthCore XCTest Suite
      run: |
        xcodebuild test \
          -project RosettaHealth.xcodeproj \
          -scheme RosettaHealthCoreTests \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \

