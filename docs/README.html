<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>README - RosettaHealth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
  <style>
    :root {
      --bg: #0b0b0f;
      --sidebar-bg: rgba(15, 15, 20, 0.75);
      --text: #cbd5e1;
      --accent: #38bdf8;
      --accent-purple: #a855f7;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg); color: var(--text); font-family: var(--font);
      display: flex; height: 100vh; overflow: hidden;
    }
    a { text-decoration: none; }
    .glass { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .text-gradient {
      background: -webkit-linear-gradient(0deg, var(--accent-purple), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    /* Layout */
    .app-container { display: flex; width: 100%; height: 100%; }
    
    /* Sidebar */
    .sidebar {
      width: 280px; flex-shrink: 0; background-color: var(--sidebar-bg);
      border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
      transition: transform 0.3s ease; z-index: 50;
    }
    .sidebar-header {
      padding: 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-title { font-size: 1.5rem; font-weight: 700; }
    .sidebar-close { display: none; background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
    
    .sidebar-content { flex: 1; overflow-y: auto; padding: 0 24px 24px 24px; }
    .nav-section { margin-bottom: 32px; }
    .nav-section h3 { font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .nav-section ul { list-style: none; }
    .nav-section li { margin-bottom: 12px; }
    .nav-link {
      color: #94a3b8; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; display: block;
    }
    .nav-link:hover, .nav-link.active { color: var(--accent); }
    
    /* Main Content */
    .main-wrapper {
      flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative;
    }
    .mesh-bg {
      position: absolute; inset: 0; z-index: -1;
      background: radial-gradient(circle at 10% 50%, rgba(139, 92, 246, 0.08), transparent 40%),
                  radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.08), transparent 40%);
    }
    .mobile-header {
      display: none; align-items: center; justify-content: space-between; padding: 16px 24px;
      background-color: var(--sidebar-bg); border-bottom: 1px solid rgba(255,255,255,0.05);
      position: sticky; top: 0; z-index: 30;
    }
    .mobile-title { font-size: 1.125rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 16px; }
    .hamburger {
      background: rgba(56, 189, 248, 0.1); color: var(--accent); border: none;
      padding: 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    
    .content-area {
      flex: 1; overflow-y: auto; padding: 24px;
    }
    .content-inner {
      max-width: 850px; margin: 0 auto; padding-bottom: 60px;
    }

    /* Mobile Overlay */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: none; opacity: 0; transition: opacity 0.3s ease;
    }

    /* Mobile Responsiveness */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-close { display: block; }
      .mobile-header { display: flex; }
      .overlay.open { display: block; opacity: 1; }
      .content-area { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Mobile Overlay -->
    <div id="overlay" class="overlay glass" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar glass">
      <div class="sidebar-header">
        <a href="./" class="sidebar-title text-gradient">⚕️ RosettaHealth</a>
        <button onclick="toggleSidebar()" class="sidebar-close">×</button>
      </div>

      <div class="sidebar-content">
        <div class="nav-section">
          <h3>Documentazione Core</h3>
          <ul>
            <li><a href="README" class="nav-link" data-id="README">Homepage Docs</a></li>
            <li><a href="GUIDA_UTENTE" class="nav-link" data-id="GUIDA_UTENTE">Guida Utente</a></li>
            <li><a href="tdd" class="nav-link" data-id="tdd">Technical Design (TDD)</a></li>
          </ul>
        </div>
        <div class="nav-section">
          <h3>Analisi e Business</h3>
          <ul>
            <li><a href="Stato_dell_Arte" class="nav-link" data-id="Stato_dell_Arte">Stato dell'Arte</a></li>
            <li><a href="Sviluppi_Futuri" class="nav-link" data-id="Sviluppi_Futuri">Sviluppi Futuri</a></li>
          </ul>
        </div>
        <div class="nav-section">
          <h3>Compliance e Privacy</h3>
          <ul>
            <li><a href="DPIA" class="nav-link" data-id="DPIA">Valutazione GDPR (DPIA)</a></li>
            <li><a href="INTERNATIONALIZATION" class="nav-link" data-id="INTERNATIONALIZATION">Internazionalizzazione</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper">
      <div class="mesh-bg"></div>
      
      <!-- Mobile Header -->
      <header class="mobile-header glass">
        <div class="mobile-title text-gradient">README</div>
        <button onclick="toggleSidebar()" class="hamburger">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </header>

      <main class="content-area">
        <div class="content-inner">
          <zero-md src="markdown/README.md">
            <template>
              <style>
                .markdown-body { background: transparent !important; color: #cbd5e1 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; padding: 0 !important; font-size: 16px !important; line-height: 1.6 !important; }
                .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid rgba(255,255,255,0.1) !important; color: #f8fafc !important; margin-top: 1.5em !important; font-weight: 700 !important; }
                .markdown-body h1 { font-size: 2.25rem !important; }
                .markdown-body h2 { font-size: 1.75rem !important; }
                .markdown-body a { color: #38bdf8 !important; text-decoration: none !important; }
                .markdown-body a:hover { text-decoration: underline !important; }
                .markdown-body pre { background: rgba(0,0,0,0.5) !important; border-radius: 12px !important; border: 1px solid rgba(255,255,255,0.05) !important; padding: 16px !important; overflow-x: auto !important; }
                .markdown-body code { background: rgba(255,255,255,0.1) !important; border-radius: 6px !important; padding: 3px 6px !important; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important; font-size: 0.9em !important; }
                .markdown-body blockquote { border-left: 4px solid #a855f7 !important; color: #94a3b8 !important; background: rgba(255,255,255,0.03) !important; padding: 16px 20px !important; border-radius: 0 12px 12px 0 !important; margin: 1.5em 0 !important; font-style: normal !important; }
                .markdown-body table { width: 100% !important; display: block !important; overflow-x: auto !important; white-space: nowrap !important; border-collapse: collapse !important; margin: 1.5em 0 !important; }
                .markdown-body table tr { background-color: transparent !important; border-top: 1px solid rgba(255,255,255,0.1) !important; }
                .markdown-body table th, .markdown-body table td { border: 1px solid rgba(255,255,255,0.1) !important; padding: 12px 16px !important; }
                .markdown-body table th { background-color: rgba(255,255,255,0.05) !important; font-weight: 600 !important; }
                .markdown-body table tr:nth-child(2n) { background-color: rgba(255,255,255,0.02) !important; }
                .markdown-body img { border-radius: 12px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important; max-width: 100% !important; height: auto !important; margin: 1.5em 0 !important; }
                .markdown-body ul, .markdown-body ol { padding-left: 1.5em !important; margin-bottom: 1em !important; }
                .markdown-body li { margin-bottom: 0.5em !important; }
              </style>
            </template>
          </zero-md>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Imposta il link attivo nella sidebar
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.dataset.id === 'README') {
        link.classList.add('active');
      }
    });

    // Logica per il menu laterale (Mobile)
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    
    function toggleSidebar() {
      const isOpen = sidebar.classList.contains('open');
      if (isOpen) {
        sidebar.classList.remove('open');
        setTimeout(() => overlay.classList.remove('open'), 50); // delay per animazione fluida
      } else {
        sidebar.classList.add('open');
        overlay.classList.add('open');
      }
    }
  </script>
</body>
</html>
