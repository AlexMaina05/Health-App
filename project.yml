name: RosettaEdge
options:
  xcodeVersion: "16.0"
  bundleIdPrefix: dev.alexmaina
  deploymentTarget:
    iOS: 17.0
    watchOS: 10.0

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
targets:
  RosettaEdgeApp:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources: [Sources/RosettaEdgeApp]
    dependencies:
      - target: RosettaEdgeCore
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [fetch, processing]
        NSHealthUpdateUsageDescription: "L'app necessita di scrivere i tuoi referti su Apple Salute."
        NSHealthShareUsageDescription: "L'app necessita di accedere ad Apple Salute per la sincronizzazione."
        NSFaceIDUsageDescription: "L'app utilizza Face ID per sbloccare in sicurezza il tuo Vault Medico."

  RosettaEdgeCore:
    type: framework
    platform: iOS
    deploymentTarget: 17.0
    sources: [Sources/RosettaEdgeCore]

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources: [Sources/ShareExtension]
    dependencies:
      - target: RosettaEdgeCore
    info:
      path: Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
  RosettaEdgeCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources: [Tests/RosettaEdgeCoreTests]
    dependencies:
      - target: RosettaEdgeCore
