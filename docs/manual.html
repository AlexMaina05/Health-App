<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Manuale - RosettaHealth</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #38BDF8;
      --base-font-size: 16px;
      --base-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --sidebar-background: rgba(15, 15, 20, 0.65);
      --sidebar-width: 320px;
    }
    body {
      background: radial-gradient(circle at 10% 50%, rgba(139, 92, 246, 0.12), transparent 30%),
                  radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.12), transparent 30%),
                  #0b0b0f !important;
      background-attachment: fixed; color: #cbd5e1; font-weight: 400;
    }
    .sidebar {
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 4px 0 30px rgba(0, 0, 0, 0.3); padding-top: 20px;
    }
    .sidebar h1 { font-weight: 700; background: -webkit-linear-gradient(0deg, #a855f7, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .markdown-section pre { border-radius: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
    .markdown-section blockquote { background: rgba(255,255,255,0.02); border-left: 4px solid #a855f7; border-radius: 12px; backdrop-filter: blur(10px); }
  </style>
</head>
<body>
  <div id="app">Caricamento Manuale...</div>
  <script>
    window. = {
      name: 'Torna alla Home',
      nameLink: 'index.html',
      repo: 'https://github.com/AlexMaina05/Health-App',
      loadSidebar: true,
      coverpage: false, /* NESSUNA COVER PAGE, NESSUN BUG DI ROUTING */
      subMaxLevel: 3,
      auto2top: true,
      search: 'auto',
      themeColor: '#38BDF8',
      homepage: 'README.md'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
