<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RosettaHealth</title>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: var(--font-family);
            background: linear-gradient(135deg, #0b0b0f 0%, #151025 50%, #0a1320 100%);
            color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; overflow: hidden;
        }
        .mesh {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1;
            background: radial-gradient(circle at 10% 50%, rgba(139, 92, 246, 0.15), transparent 40%),
                        radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.15), transparent 40%);
        }
        .container {
            z-index: 2;
            max-width: 800px; padding: 40px;
        }
        h1 {
            font-size: 5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #a855f7, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        h2 {
            font-size: 1.8rem; font-weight: 300; color: #94a3b8; margin-bottom: 40px; line-height: 1.4;
        }
        .buttons {
            display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
        }
        .btn {
            text-decoration: none; border-radius: 100px; padding: 16px 40px; font-size: 1.2rem; font-weight: 600;
            transition: all 0.3s ease; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .btn-primary {
            background: linear-gradient(90deg, #8b5cf6, #0ea5e9); color: white;
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3); border: none;
        }
        .btn-primary:hover {
            transform: translateY(-3px); box-shadow: 0 12px 40px rgba(139, 92, 246, 0.5);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.05); color: white;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1); transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="mesh"></div>
    <div class="container">
        <h1>⚕️ RosettaHealth</h1>
        <h2>Il ponte Zero-Cloud tra il tuo Fascicolo Sanitario e Apple Salute. Inietta i referti PDF nell'ecosistema Apple in totale sicurezza.</h2>
        <div class="buttons">
            <a href="manual.html" class="btn btn-primary">Inizia a Leggere</a>
            <a href="https://github.com/AlexMaina05/Health-App" class="btn btn-secondary">Guarda su GitHub</a>
        </div>
    </div>
</body>
</html>
