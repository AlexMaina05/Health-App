name: 🤖 iOS Agentic UI Test

on:
  workflow_dispatch: # Permette di lanciarlo esclusivamente a mano dal pannello Actions

jobs:
  autonomous-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App for Simulator
        run: |
          # Compila l'app per il simulatore disabilitando la firma (non serve su simulatore)
          xcodebuild -project RosettaHealth.xcodeproj \
            -scheme RosettaHealthApp \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          # Aggiunge Maestro al PATH della GitHub Action
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot Simulator & Install App
        run: |
          # Trova l'UDID del primo simulatore iPhone 16 disponibile (per evitare conflitti di nome)
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices[] | .[] | select(.name | contains("iPhone 16")) | .udid' | head -n 1)
          echo "Avvio simulatore con UDID: $DEVICE_ID"
          
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID"
          
          # Cerca l'app compilata in modo dinamico
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          echo "Trovata App: $APP_PATH"
          
          # Installa l'app nel simulatore (booted si riferisce a quello appena avviato)
          xcrun simctl install booted "$APP_PATH"
          
      - name: Install & Run Ollama (Local LLM)
        run: |
          brew install ollama
          # Avvia Ollama in background
          ollama serve &
          sleep 3
          # Scarica il modello Llama 3.2 (circa 2GB, molto veloce su M1)
          ollama pull llama3.2
          
      - name: 🧠 Run Agentic Tester (Local AI)
        run: |
          python3 -m pip install requests --break-system-packages
          # Esegui lo script python 100% in locale senza chiavi API
          python3 scripts/run_agentic_tester.py --platform ios --app "dev.alexmaina.RosettaHealthApp" --goal "Verifica che l'app sia avviata. Se vedi elementi della dashboard come 'waveform.path.ecg', hai raggiunto l'obiettivo e devi dichiarare 'success'."
