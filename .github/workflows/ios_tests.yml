name: iOS Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14 # Uses latest macOS (M1/M2 silicon runners on GH)
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        if [ -d "/Applications/Xcode_16.0.app" ]; then sudo xcode-select -s /Applications/Xcode_16.0.app; 
        elif [ -d "/Applications/Xcode_16.1.app" ]; then sudo xcode-select -s /Applications/Xcode_16.1.app; 
        elif [ -d "/Applications/Xcode_16.2.app" ]; then sudo xcode-select -s /Applications/Xcode_16.2.app; 
        else sudo xcode-select -s /Applications/Xcode_16.app; fi

    - name: Install Dependencies
      run: |
        brew install xcodegen
        # sudo gem install xcpretty # optional for formatting

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Run RosettaHealthCore XCTest Suite
      run: |
        xcodebuild test \
          -project RosettaHealth.xcodeproj \
          -scheme RosettaHealthCoreTests \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2'

    - name: Build Unsigned App (for Sideloading)
      run: |
        xcodebuild -project RosettaHealth.xcodeproj \
        -scheme RosettaHealthApp \
        -configuration Release \
        -sdk iphoneos \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO \
        clean build \
        CONFIGURATION_BUILD_DIR="$(pwd)/build"

    - name: Create IPA Package
      run: |
        mkdir Payload
        mv build/RosettaHealthApp.app Payload/
        zip -r RosettaHealthApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RosettaHealthApp-Unsigned
        path: RosettaHealthApp.ipa
